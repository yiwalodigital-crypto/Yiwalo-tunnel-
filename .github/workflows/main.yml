name: Compiler YIWALO Tunnel APK

on:
  push:
    branches: [principal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler APK
        run: gradle --version && gradle assembleDebug --stacktrace

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: YIWALO-Tunnel-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

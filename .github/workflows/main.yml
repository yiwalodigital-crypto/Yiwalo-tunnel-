name: Compiler YIWALO Tunnel APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Verifier les fichiers Android
        run: |
          echo "Contenu du projet :"
          ls -la
          echo "Recherche des fichiers Gradle..."
          find . -maxdepth 4 \( -name gradlew -o -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        # Si ton projet est dans un sous-dossier, décommente la ligne ci-dessous et mets le chemin (ex: './dossier')
        # with:
        #   build-root-directory: '.'

      - name: Rendre gradlew exécutable
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          elif [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            # Au cas où Gradle Wrapper est présent mais sans le script gradlew à la racine
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Compiler APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f ./build.gradle ] || [ -f ./build.gradle.kts ]; then
            gradle assembleDebug --stacktrace
          else
            echo "ERREUR : fichier Gradle introuvable."
            exit 1
          fi

      - name: Publier APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YIWALO-Tunnel-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
